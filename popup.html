<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JALI Translation</title>
  <style>
    /* Base Styles with Dyslexia-Friendly Features */
    :root {
      --primary: #f8e473;
      --primary-dark: #e6cc45;
      --secondary: #fffdf0;
      --text: #333;
      --text-light: #666;
      --border: #e3d7a3;
      --radius: 12px;
      --transition: all 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--secondary);
      color: var(--text);
      line-height: 1.6;
      letter-spacing: 0.5px;
      word-spacing: 2px;
    }
    
    /* Dyslexia-friendly styles */
    p, label, input, select, button {
      line-height: 1.8;
      margin-bottom: 0.8em;
    }
    
    /* Header */
    .header {
      background-color: var(--primary);
      padding: 18px 15px;
      text-align: center;
      border-bottom: 2px dashed var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      animation: fadeIn 0.5s ease-out;
    }
    
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #755c00;
      margin-bottom: 5px;
      font-family: 'Palatino', 'Book Antiqua', serif;
    }
    
    .tagline {
      font-size: 13px;
      color: #755c00;
      position: relative;
      display: inline-block;
    }
    
    .tagline::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 4px;
      bottom: -4px;
      left: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='8' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,4 C10,0 20,8 30,4 C40,0 50,8 60,4 C70,0 80,8 90,4 C95,2 100,6 100,4' stroke='%23755c00' fill='none' stroke-width='2'/%3E%3C/svg%3E");
      background-repeat: repeat-x;
      background-size: auto 100%;
    }
    
    /* Navigation */
    .nav {
      display: flex;
      margin: 15px;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    .nav-item {
      flex: 1;
      text-align: center;
      padding: 12px 8px;
      cursor: pointer;
      background-color: white;
      transition: var(--transition);
      font-weight: 500;
      font-size: 14px;
    }
    
    .nav-item:first-child {
      border-radius: var(--radius) 0 0 var(--radius);
    }
    
    .nav-item:last-child {
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    
    .nav-item.active {
      background-color: var(--primary);
      font-weight: bold;
    }
    
    .nav-item:hover:not(.active) {
      background-color: #fffefa;
    }
    
    /* Content Sections */
    .content {
      padding: 15px;
      animation: fadeIn 0.4s ease-out;
    }
    
    .section {
      display: none;
    }
    
    .section.active {
      display: block;
      animation: fadeIn 0.4s ease-out;
    }
    
    /* Form Elements */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #755c00;
      position: relative;
      padding-left: 5px;
    }
    
    label.required::after {
      content: '*';
      color: #e74c3c;
      margin-left: 4px;
    }
    
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background-color: #fffef5;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 15px;
      transition: var(--transition);
      box-sizing: border-box;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-dark);
      box-shadow: 0 0 0 3px rgba(248, 228, 115, 0.3);
    }
    
    /* Better Toggle Switch */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .toggle-label {
      flex: 1;
    }
    
    .toggle {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 28px;
    }
    
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    input:checked + .toggle-slider {
      background-color: var(--primary-dark);
    }
    
    input:focus + .toggle-slider {
      box-shadow: 0 0 1px var(--primary-dark);
    }
    
    input:checked + .toggle-slider:before {
      transform: translateX(24px);
    }
    
    /* Button Styles */
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: var(--transition);
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
    }
    
    button:hover {
      background-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    button:active {
      transform: translateY(0);
      box-shadow: 0 2px 3px rgba(0,0,0,0.1);
    }
    
    button::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: -100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.4s;
    }
    
    button:hover::after {
      left: 100%;
    }
    
    /* API Key Section */
    .api-profile-item {
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      background-color: #fffef5;
      animation: fadeIn 0.3s ease-out;
      position: relative;
      transition: var(--transition);
    }
    
    .api-profile-item:hover {
      border-color: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }
    
    .api-profile-name {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 16px;
      color: #755c00;
    }
    
    .api-profile-created {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 8px;
    }
    
    .api-profile-actions {
      display: flex;
      gap: 8px;
    }
    
    .api-btn {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      min-width: 0;
    }
    
    .api-btn.activate-btn {
      background-color: #9fe6a0;
    }
    
    .api-btn.activate-btn:hover {
      background-color: #8ad58b;
    }
    
    .api-btn.delete-btn {
      background-color: #ffd3d3;
    }
    
    .api-btn.delete-btn:hover {
      background-color: #ffbdbd;
    }
    
    .api-active-indicator {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #9fe6a0;
      box-shadow: 0 0 5px rgba(159, 230, 160, 0.5);
      animation: pulse 2s infinite;
    }
    
    /* Empty States */
    .empty-state {
      text-align: center;
      padding: 25px 15px;
      color: var(--text-light);
      background-color: #fffef5;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      font-style: italic;
    }
    
    /* Footer */
    .footer {
      padding: 10px;
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      border-top: 1px dashed var(--border);
      margin-top: 10px;
    }
    
    /* Notification */
    .notification {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background-color: var(--primary);
      border-radius: var(--radius);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 1000;
      animation: fadeIn 0.3s ease-out;
    }
    
    /* Dyslexia-friendly focus styles */
    *:focus {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">JALI</div>
    <div class="tagline">Translate with confidence, hear with clarity</div>
  </div>
  
  <!-- Navigation -->
  <div class="nav">
    <div class="nav-item active" data-tab="translate">Translate</div>
    <div class="nav-item" data-tab="profiles">Profiles</div>
    <div class="nav-item" data-tab="settings">Settings</div>
  </div>
  
  <!-- Content Sections -->
  <div class="content">
    <!-- Translate Section -->
    <div class="section active" id="translate-section">
      <div class="form-group">
        <label for="translate-language">Translate To</label>
        <select id="translate-language">
          <option value="tw">Twi</option>
          <option value="ee">Ewe</option>
          <option value="gaa">Ga</option>
          <option value="fat">Fante</option>
          <option value="dag">Dagbani</option>
          <option value="gur">Gurene</option>
          <option value="yo">Yoruba</option>
          <option value="ki">Kikuyu</option>
          <option value="luo">Luo</option>
          <option value="mer">Kimeru</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="active-profile">Active Profile</label>
        <select id="active-profile">
          <option value="">Select a profile</option>
          <!-- Will be populated by JavaScript -->
        </select>
      </div>
      
      <div class="form-group toggle-container">
        <label class="toggle-label">Include Audio</label>
        <label class="toggle">
          <input type="checkbox" id="include-audio" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      
      <div class="form-group">
        <div id="current-status">Ready to translate selected text.</div>
      </div>
      
      <button id="translate-button">Translate Selected Text</button>
    </div>
    
    <!-- API Profiles Section -->
    <div class="section" id="profiles-section">
      <div class="form-group">
        <label for="profile-name" class="required">Profile Name</label>
        <input type="text" id="profile-name" placeholder="e.g. Personal, Work, School">
      </div>
      
      <div class="form-group">
        <label for="api-key" class="required">API Key</label>
        <input type="password" id="api-key" placeholder="Enter your API key">
      </div>
      
      <div class="form-group">
        <label for="api-url">API URL (Optional)</label>
        <input type="text" id="api-url" placeholder="Leave blank for default">
      </div>
      
      <button id="add-profile">Add Profile</button>
      
      <div id="profiles-list" class="form-group" style="margin-top: 20px;">
        <!-- API profiles will be populated here by JavaScript -->
      </div>
    </div>
    
    <!-- Settings Section -->
    <div class="section" id="settings-section">
      <div class="form-group">
        <label for="default-language">Default Language</label>
        <select id="default-language">
          <option value="tw">Twi</option>
          <option value="ee">Ewe</option>
          <option value="gaa">Ga</option>
          <option value="fat">Fante</option>
          <option value="dag">Dagbani</option>
          <option value="gur">Gurene</option>
          <option value="yo">Yoruba</option>
          <option value="ki">Kikuyu</option>
          <option value="luo">Luo</option>
          <option value="mer">Kimeru</option>
        </select>
      </div>
      
      <div class="form-group toggle-container">
        <label class="toggle-label">Dyslexia-Friendly Font</label>
        <label class="toggle">
          <input type="checkbox" id="dyslexia-font">
          <span class="toggle-slider"></span>
        </label>
      </div>
      
      <div class="form-group toggle-container">
        <label class="toggle-label">High Contrast Mode</label>
        <label class="toggle">
          <input type="checkbox" id="high-contrast">
          <span class="toggle-slider"></span>
        </label>
      </div>
      
      <div class="form-group toggle-container">
        <label class="toggle-label">Save History</label>
        <label class="toggle">
          <input type="checkbox" id="save-history" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      
      <button id="save-settings">Save Settings</button>
      <button id="clear-history" style="background-color: #f0f0f0; color: #666; margin-top: 20px;">Clear Translation History</button>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    JALI Translation v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
